<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Profile | Internship Finder</title>
<style>
body { font-family: 'Segoe UI', Tahoma, sans-serif; padding:20px; background:#f5f7fa; }
h2 { color:#0a3d62; text-align:center; }
table { width:100%; border-collapse:collapse; margin-top:20px; }
th, td { border:1px solid #ddd; padding:10px; text-align:center; }
th { background:#1dd1a1; color:#000; }
.no-data { text-align:center; color:#777; margin-top:20px; font-size:16px; }
</style>
</head>
<body>

<h2>Students Applied to Your Company</h2>

<table id="appliedTable">
    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Branch</th>
            <th>Year</th>
            <th>Skills</th>
        </tr>
    </thead>
    <tbody>
        <!-- JS will populate -->
    </tbody>
</table>

<div id="noData" class="no-data" style="display:none;">
    No students have applied to this company yet.
</div>

<script>
// ===============================
// New functionality added
// ===============================

// Get the selected company from localStorage (set when student clicks "Register" for a company)
const companyName = localStorage.getItem("selectedCompany");

if(!companyName){
    alert("No company selected!");
    window.location.href = "registeredCompanies.html"; // Redirect to company list
}

// Load all students
const students = JSON.parse(localStorage.getItem("students")) || [];
const tableBody = document.querySelector("#appliedTable tbody");
const noDataDiv = document.getElementById("noData");

// Filter students who registered for this company
const appliedStudents = students.filter(student => student.appliedCompany === companyName);

if(appliedStudents.length > 0){
    appliedStudents.forEach(student => {
        const row = document.createElement("tr");
        row.innerHTML = `
            <td>${student.name || "-"}</td>
            <td>${student.email || "-"}</td>
            <td>${student.phone || "-"}</td>
            <td>${student.branch || "-"}</td>
            <td>${student.year || "-"}</td>
            <td>${student.skills || "-"}</td>
        `;
        tableBody.appendChild(row);
    });
} else {
    document.getElementById("appliedTable").style.display = "none";
    noDataDiv.style.display = "block";
}
</script>

</body>
</html>
