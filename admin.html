<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Internship Finder</title>

<style>
body { font-family:'Segoe UI'; background:#f5f7fa; padding:20px; }
h1 { text-align:center; color:#0a3d62; }

.section { background:#fff; padding:20px; border-radius:10px; margin-bottom:30px; box-shadow:0 4px 10px rgba(0,0,0,0.1); }
.section h2 { color:#1dd1a1; }

table { width:100%; border-collapse:collapse; margin-top:10px; }
th, td { border:1px solid #ddd; padding:10px; text-align:center; }
th { background:#0a3d62; color:white; }

input { width:95%; padding:5px; }

button {
    padding:6px 10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.delete-btn { background:#ee5253; color:white; }
.block-btn { background:#ff9f43; color:black; }
.unblock-btn { background:#1dd1a1; color:black; }
.export-btn { background:#0a3d62; color:white; margin-bottom:10px; }
</style>
</head>

<body>

<h1>Admin Dashboard</h1>

<!-- STUDENTS -->
<div class="section">
<h2>Students</h2>
<button class="export-btn" onclick="exportStudents()">Export Students</button>

<table>
<thead>
<tr>
<th>Name</th><th>Email</th><th>Skills</th><th>Actions</th>
</tr>
</thead>
<tbody id="studentTable"></tbody>
</table>
</div>

<!-- COMPANIES -->
<div class="section">
<h2>Companies</h2>
<button class="export-btn" onclick="exportCompanies()">Export Companies</button>

<table>
<thead>
<tr>
<th>Company</th><th>Email</th><th>Field</th><th>Actions</th>
</tr>
</thead>
<tbody id="companyTable"></tbody>
</table>
</div>

<script>
let students = JSON.parse(localStorage.getItem("students")) || [];
let companies = JSON.parse(localStorage.getItem("companies")) || [];

let blockedStudents = JSON.parse(localStorage.getItem("blockedStudents")) || [];
let blockedCompanies = JSON.parse(localStorage.getItem("blockedCompanies")) || [];

/* ---------- STUDENTS ---------- */
const studentTable = document.getElementById("studentTable");

function loadStudents(){
studentTable.innerHTML="";
if(students.length===0){
studentTable.innerHTML="<tr><td colspan='4'>No students</td></tr>";
return;
}

students.forEach((s,i)=>{
let isBlocked = blockedStudents.includes(s.email);
studentTable.innerHTML+=`
<tr>
<td><input value="${s.name}" onchange="updateStudent(${i},'name',this.value)"></td>
<td>${s.email}</td>
<td><input value="${s.skills}" onchange="updateStudent(${i},'skills',this.value)"></td>
<td>
<button class="${isBlocked?'unblock-btn':'block-btn'}"
onclick="toggleStudentBlock('${s.email}')">
${isBlocked?'Unblock':'Block'}
</button>
<button class="delete-btn" onclick="deleteStudent(${i})">Delete</button>
</td>
</tr>`;
});
}

function updateStudent(i,f,v){
students[i][f]=v;
localStorage.setItem("students",JSON.stringify(students));
}

function deleteStudent(index){
if(!confirm("This will remove student, resume & applications. Continue?")) return;

const email = students[index].email;

/* remove resume */
localStorage.removeItem("resume_"+email);

/* remove applications */
let apps = JSON.parse(localStorage.getItem("applications")) || [];
apps = apps.filter(a => a.studentEmail !== email);
localStorage.setItem("applications",JSON.stringify(apps));

/* auto block */
if(!blockedStudents.includes(email)) blockedStudents.push(email);

/* remove student */
students.splice(index,1);

localStorage.setItem("students",JSON.stringify(students));
localStorage.setItem("blockedStudents",JSON.stringify(blockedStudents));

loadStudents();
}

function toggleStudentBlock(email){
if(blockedStudents.includes(email)){
blockedStudents = blockedStudents.filter(e=>e!==email);
}else{
blockedStudents.push(email);
}
localStorage.setItem("blockedStudents",JSON.stringify(blockedStudents));
loadStudents();
}

/* ---------- COMPANIES ---------- */
const companyTable=document.getElementById("companyTable");

function loadCompanies(){
companyTable.innerHTML="";
if(companies.length===0){
companyTable.innerHTML="<tr><td colspan='4'>No companies</td></tr>";
return;
}

companies.forEach((c,i)=>{
let isBlocked = blockedCompanies.includes(c.email);
companyTable.innerHTML+=`
<tr>
<td><input value="${c.companyName}" onchange="updateCompany(${i},'companyName',this.value)"></td>
<td>${c.email}</td>
<td><input value="${c.field}" onchange="updateCompany(${i},'field',this.value)"></td>
<td>
<button class="${isBlocked?'unblock-btn':'block-btn'}"
onclick="toggleCompanyBlock('${c.email}')">
${isBlocked?'Unblock':'Block'}
</button>
<button class="delete-btn" onclick="deleteCompany(${i})">Delete</button>
</td>
</tr>`;
});
}

function updateCompany(i,f,v){
companies[i][f]=v;
localStorage.setItem("companies",JSON.stringify(companies));
}

function deleteCompany(index){
if(!confirm("Remove company permanently?")) return;
const email = companies[index].email;

if(!blockedCompanies.includes(email)) blockedCompanies.push(email);
companies.splice(index,1);

localStorage.setItem("companies",JSON.stringify(companies));
localStorage.setItem("blockedCompanies",JSON.stringify(blockedCompanies));
loadCompanies();
}

function toggleCompanyBlock(email){
if(blockedCompanies.includes(email)){
blockedCompanies = blockedCompanies.filter(e=>e!==email);
}else{
blockedCompanies.push(email);
}
localStorage.setItem("blockedCompanies",JSON.stringify(blockedCompanies));
loadCompanies();
}

/* ---------- EXPORT ---------- */
function exportStudents(){
let csv="Name,Email,Skills\n";
students.forEach(s=>csv+=`${s.name},${s.email},${s.skills}\n`);
download(csv,"students.xlsx");
}

function exportCompanies(){
let csv="Company,Email,Field\n";
companies.forEach(c=>csv+=`${c.companyName},${c.email},${c.field}\n`);
download(csv,"companies.xlsx");
}

function download(data,name){
const blob=new Blob([data],{type:"text/csv"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=name;
a.click();
}

/* INIT */
loadStudents();
loadCompanies();
</script>

</body>
</html>
