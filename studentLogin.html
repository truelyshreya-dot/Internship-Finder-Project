<!DOCTYPE html>
<html>
<head>
<title>Student Login</title>
</head>
<body>

<h2>Student Login</h2>

<form id="loginForm">
    <input type="email" id="email" placeholder="College Email" required><br><br>
    <input type="password" id="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
</form>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();

    let students = JSON.parse(localStorage.getItem("students")) || [];
    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let student = students.find(s => s.email === email && s.password === password);

    if (!student) {
        alert("Invalid login details");
        return;
    }

    localStorage.setItem("loggedInStudent", email);
    alert("Login successful!");
    window.location.href = "companyList.html";
});
</script>

</body>
</html>
